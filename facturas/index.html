<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Crear Factura</title>

  <link rel="stylesheet"
        href="css/style.css">

</head>

<body>

  <!-- TOPBAR -->

  <header class="topbar">


    <a href="../index.html"
       class="volver-btn">

      Volver al Portal

    </a>

    <h1>Facturas</h1>
    

    <a href="facturas.html"
         class="nav-btn">

        Ver Facturas

    </a>

  </header>


  <div class="container">

    <!-- TABS -->

    <div class="tabs">

      <button class="tab-btn active"
              data-tab="crearFactura">

        Crear Factura

      </button>


      <button class="tab-btn"
              data-tab="proveedores">

        Proveedores

      </button>

    </div>


    <!-- =========================
         CREAR FACTURA
    ========================== -->

    <section id="crearFactura"
             class="tab-content active">

      <h1 class="titulo">

        Crear Factura

      </h1>


      <!-- PROVEEDOR -->

      <div class="form-group">

        <label>Proveedor</label>

        <select id="proveedor"
                class="input">

          <option value="">
            Seleccionar proveedor
          </option>

        </select>

      </div>


      <!-- NÚMERO FACTURA -->

      <div class="form-group">

        <label>Número Factura</label>

        <input type="text"
               id="numero_factura">

      </div>


      <!-- FECHA -->

      <div class="form-group">

        <label>Fecha</label>

        <input type="date"
               id="fecha">

      </div>


      <hr>


      <!-- PRODUCTOS -->

      <h2>Productos</h2>

      <div id="productos-container"></div>


      <button id="agregar-producto">

        Agregar Producto

      </button>


      <hr>


      <!-- TOTAL -->

      <h2 id="total">

        Total: $0

      </h2>


      <!-- GUARDAR -->

      <button id="guardar-factura">

        Guardar Factura

      </button>


      <br><br>
 

    </section>


    <!-- =========================
         PROVEEDORES
    ========================== -->

    <section id="proveedores"
             class="tab-content">

      <div class="card">

        <h2>Proveedores</h2>


        <input type="text"
               id="nuevoProveedor"
               class="input"
               placeholder="Nombre proveedor">


        <button id="agregarProveedorBtn"
                class="btn agregar-btn">

          Agregar Proveedor

        </button>


        <div id="listaProveedores"
             class="lista-categorias">

        </div>

      </div>

    </section>

  </div>


  <!-- TOAST -->

  <div id="toast"
       class="toast">

  </div>


  <!-- JS -->
   

  <script src="js/api.js"></script>

  <script src="js/utils.js"></script>

  <script src="js/crear-factura.js"></script>

</body>
</html>
