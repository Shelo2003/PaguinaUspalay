<!DOCTYPE html>

    <title>Horarios Cocina</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="manifest" href="/PaguinaUspalay/manifest.json">

    <meta

        content="#000000"

        <!-- IZQUIERDA -->

        <a href="../index.html"

        <h2 class="titulo">
            Horario Semanal

        <!-- PDF -->

        <div class="horarios-pdf">


            
                <!--TURNO DIA-->
            

            <h2 class="subtitulo-turno turno-dia-title">
                ☀️ Turno Día
            </h2>


            <div class="tabla-horario-container">

                <table class="tabla-horario">

                    <thead>

                        <tr>

                            <th>Martes</th>
                            <th>Miércoles</th>
                            <th>Jueves</th>
                            <th>Viernes</th>
                            <th>Sábado</th>
                            <th>Domingo</th>

                        </tr>

                    </thead>


                    <tbody>

                        <tr>

                            <!-- MARTES -->

                            <td>

                                <div class="dia-columna">

                                    <button
                                        class="btn-agregar"
                                        onclick="
                                            agregarPersona(
                                                'dia',
                                                'Martes'
                                            )
                                        "
                                    >

                                        +

                                    </button>


                                    <div id="dia-Martes"
                                         class="lista-dia">

                                    </div>

                                </div>

                            </td>


                            <!-- MIERCOLES -->

                            <td>

                                <div class="dia-columna">

                                    <button
                                        class="btn-agregar"

                                    </button>


                                    <div id="dia-Miércoles"

                                    </div>

                                </div>

                            </td>


                            <!-- VIERNES -->

                                    <button
                                        class="btn-agregar"

                                            agregarPersona(
                                                'dia',
                                                'Viernes'
                                            )
                                        "
                                    >

                                        +

                                    </button>


                                    <div id="dia-Viernes"
                                         class="lista-dia">

                                    </div>

                                </div>

                            </td>


                            <!-- SABADO -->

                                    <button
                                        class="btn-agregar"

                                            agregarPersona(

                                    <div id="dia-Domingo"

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        <!-- BOTONES -->

    <!-- PDF -->
