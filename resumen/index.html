<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Resumen Uspalay</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>


    <!-- =========================
         TOPBAR
    ========================== -->

    <header class="topbar">


        <!-- VOLVER -->

        <a href="../index.html"
           class="volver-btn">

            Volver al Portal

        </a>


        <!-- TITULO -->

        <div class="logo-area">

            <h1>
                📱 Resumen Uspalay
            </h1>

            <p>
                Vista rápida del negocio
            </p>

        </div>


        <!-- LOGO -->

        <img src="../assets/logoUspa.jpeg"
             class="logo-navbar">

    </header>



    <!-- =========================
         CONTAINER
    ========================== -->

    <main class="container">


        <h2 class="titulo">

            ¿Qué deseas revisar?

        </h2>



        <!-- =====================
             CARDS
        ====================== -->

        <div class="cards-container">


            <!-- INVENTARIO -->

            <a href="inventario.html"
               class="card inventario-card">

                <div class="icono">

                    📦

                </div>


                <h3>
                    Inventario
                </h3>


                <p>

                    Ver productos, categorías
                    y stock disponible.

                </p>

            </a>



            <!-- FACTURAS -->

            <a href="facturas.html"
               class="card facturas-card">

                <div class="icono">

                    📄

                </div>


                <h3>
                    Facturas
                </h3>


                <p>

                    Revisar facturas
                    ingresadas al sistema.

                </p>

            </a>



            <!-- BOLETAS -->

            <a href="boletas.html"
               class="card boletas-card">

                <div class="icono">

                    🧾

                </div>


                <h3>
                    Boletas
                </h3>


                <p>

                    Consultar boletas
                    registradas.

                </p>

            </a>

        </div>

    </main>



    <!-- =========================
         JS
    ========================== -->

    <script src="script.js"></script>

</body>
</html>
